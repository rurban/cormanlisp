# Corman Lisp pre-commit hooks
# Install: pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        files: \.(cpp|h|c|hpp)$
        exclude: ^(CormanLispServer/distorm/|zlib/)
        types_or: [c++, c]
        args: [--style=file, --fallback-style=none]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck
        language: system
        args:
          [
            -j4,
            --inline-suppr,
            #--check-level=exhaustive,
            --suppress=unusedFunction,
            --suppress=unmatchedSuppression,
            --suppress=missingIncludeSystem,
            --suppress=toomanyconfigs,
            --suppress=constParameterPointer,
            --suppress=constVariablePointer,
            --suppress=staticFunction,
            --suppress=unusedStructMember,
            --suppress=shadowVariable,
            --suppress=variableScope,
            --suppress=redundantAssignment,
            --suppress=unreadVariable,
            --suppress=invalidscanf,
            --suppress=knownConditionTrueFalse,
            --suppress=suspiciousFloatingPointCast,
            --suppress=nullPointerRedundantCheck,
            --suppress=nullPointerOutOfMemory,
            --suppress=nullPointerOutOfResources,
            --suppress=va_end_missing,
            --suppress=uninitvar,
            --suppress=normalCheckLevelMaxBranches,
            --suppress=checkLevelNormal,
          ]
        files: \.(cpp|h)$
        exclude: ^(CormanLispServer/distorm/|zlib/)
